name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (tests + syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krelz
          POSTGRES_PASSWORD: krelz
          POSTGRES_DB: krelz_it
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Enables tests/integration.money.test.js (real-DB money path).
      # Without it those tests skip, so local `npm test` needs no database.
      DATABASE_URL: postgresql://krelz:krelz@localhost:5432/krelz_it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check (all sources)
        run: |
          set -e
          for f in $(find src -name '*.js'); do node --check "$f"; done
          echo "all files parse"
      - name: Unit + integration tests
        run: npm test

  frontend:
    name: Frontend (build + i18n gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: i18n gate (all locales, all keys)
        run: npm run i18n:check
      - name: Unit tests (jest)
        run: npm test
      - run: npm run build
      - run: npm run lint

  scripts:
    name: Install scripts (shellcheck + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ShellCheck (all install/uninstall scripts)
        run: |
          set -e
          command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
          shellcheck --version | head -2
          shellcheck miner-app/*.sh
          echo "shellcheck clean"
      - name: Syntax check (miner-app sources)
        run: |
          set -e
          for f in $(find miner-app/src -name '*.js'); do node --check "$f"; done
          echo "miner-app sources parse"
