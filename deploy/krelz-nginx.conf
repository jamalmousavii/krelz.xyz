# Krelz Network - Nginx Config (WebSocket on port 443)
# Deploy: cp krelz-nginx.conf /etc/nginx/sites-available/krelz && nginx -t && systemctl reload nginx
#
# NOTE: limit_req_zone / limit_conn_zone live in the http context — this file
# is included from nginx.conf's http block (sites-enabled), not inside server{}.

limit_req_zone  $binary_remote_addr zone=krelz_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=krelz_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name krelz.xyz www.krelz.xyz;
    # Hardcode the apex: http://www.krelz.xyz/... jumps straight to
    # https://krelz.xyz/... (single hop) instead of https://www first.
    return 301 https://krelz.xyz$request_uri;
}

# IPv6 bypass host — visitors whose network filters the krelz.xyz SNI or the
# IPv4 address (e.g. Iran) reach this box directly over IPv6 with an SNI that
# is not krelz.xyz (sslip.io = DNS that points back here). ACME webroot lives
# in /var/www/html; the 443 twin is added once the certificate exists.
server {
    listen [::]:80;
    server_name 2a01-4f9-c011-4cf0--1.sslip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# v4 bypass tunnel — for networks that filter the krelz.xyz SNI on TLS or
# block our IPv4 (e.g. Iran), where SSLIP-v6 needs an IPv6-capable ISP.
# Origin runs systemd unit `krelz-tunnel.service`:
#   ssh -N -o ExitOnForwardFailure=yes -R 80:127.0.0.1:80 nokey@localhost.run
# Their edge terminates TLS with a *.lhr.life cert and forwards plain
# HTTP here; the visitor's real IP comes in X-Forwarded-For. Verified 6/8
# from Iran (check-host 2026-10-06). Wildcard server_name catches whatever
# random subdomain the free tunnel hands out.
server {
    listen 80;
    server_name lhr.life *.lhr.life localhost.run *.localhost.run;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 8m;
    limit_conn krelz_conn 60;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location /ws {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        limit_req zone=krelz_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# IPv6 bypass — HTTPS twin of the sslip.io :80 block above (cert: certbot
# --webroot, auto-renews). Same backends as the apex, but no Cloudflare in the
# path, so $remote_addr is already the real client.
server {
    listen [::]:443 ssl;
    http2 on;
    server_name 2a01-4f9-c011-4cf0--1.sslip.io;

    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/2a01-4f9-c011-4cf0--1.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2a01-4f9-c011-4cf0--1.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    limit_conn krelz_conn 60;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://krelz.xyz wss://krelz.xyz; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location /ws {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        limit_req zone=krelz_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Extra HTTPS ports Cloudflare proxies (same cert/SNI, forwarded to these
    # same ports here). Many networks filter TLS on 443 only (e.g. SNI-based
    # blocking in Iran); these give those visitors a working TLS entry point.
    listen 2053 ssl;
    listen 2083 ssl;
    listen 2087 ssl;
    listen 2096 ssl;
    listen 8443 ssl;
    http2 on;
    server_name krelz.xyz;

    # Attachments (images / PDFs / voice notes) ride base64 inside the chat
    # JSON body — nginx's 1 MB default would 413 them before express sees them.
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/krelz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krelz.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # krelz.xyz is proxied through Cloudflare, so every request used to arrive
    # from a CF edge IP. Without this, limit_req/limit_conn and express-rate-limit
    # were keyed by *edge* IPs: no effective per-user throttle, plus one busy edge
    # could throttle many unrelated users at once. CF overwrites
    # CF-Connecting-IP, and direct-to-origin requests are not in these ranges,
    # so the header cannot be spoofed from outside Cloudflare.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 141.101.77.0/22;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Every proxy_set_header X-Forwarded-For below forwards only $remote_addr
    # (already verified above). Express runs with `trust proxy 1`, so req.ip =
    # that single entry = the real visitor → per-user rate limits actually bind.

    limit_conn krelz_conn 60;

    # NOTE: nginx drops add_header directives inherited from this level in any
    # location that declares its own add_header — repeat the set where needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Inline script/style is required by Next.js; Google Sign-In is the only
    # third party allowed to execute or be framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://krelz.xyz wss://krelz.xyz; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # WebSocket endpoint (must be HTTP/1.1 + Upgrade headers)
    location /ws {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        # Per-IP ceiling in front of express-rate-limit (which only kicks in
        # after the request has been parsed by Node). Generous: real chat
        # traffic never exceeds a few r/s.
        limit_req zone=krelz_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        # CPU miner inference can take ~2 min (model load + generate)
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        # own add_header set → repeat the server-level security headers
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# Canonical host: www is not a second copy of the site — 301 to the apex so
# SEO/link equity consolidates on https://krelz.xyz (HSTS includeSubDomains
# already covers www via the apex headers).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.krelz.xyz;

    ssl_certificate /etc/letsencrypt/live/krelz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krelz.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://krelz.xyz$request_uri;
}

# NOTE: Port 8443 server removed — WebSocket is on 443 (/ws).
# Port 8443 is blocked by many ISPs/NATs; 443 works everywhere.
# Backend WS still listens on 127.0.0.1:8444 internally.
